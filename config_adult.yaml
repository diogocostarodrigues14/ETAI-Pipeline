# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/adult_train.csv"
  inference_path: "data/adult_new.csv"
  target: "income_over_50k"
  sensitive_attr: "sex"
  drop_columns: ["id", "fnlwgt", "education"]


# Week 4: how models are evaluated -- stratified k-fold cross-validation on the
# development set (everything except the locked test set). Same random_state = same folds on
# every run, for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # Reported for every run. fbeta_<beta> weights recall beta times as much as precision.
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"                       # one of metrics: what tuning maximises and runs are ranked by
  n_jobs: -1   

# The week 3 diagnosis, written down as cleaning rules (found in Practical/W3/notebooks/01_eda_introduction.ipynb).
# clean_dataset() in src/preprocessing.py reads everything below, so it never hardcodes COMPAS's column names.


test_set:
  size: 0
  random_state: 42

output:
  results_dir: "results/adult"
  scoreboard: "results/adult/runs.csv"
  predictions_path: "predictions/adult_predictions.csv"



diagnostics:
  id_column: "id"
  numeric_text_columns: []
  placeholder_tokens: ["?", "", "nan", "NA", "N/A"]
  validity_rules:
    age: {min: 17, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}
    capital_loss: {min: 0}
  canonical_categories: 
    workclass: {}
    occupation: {}
    native_country: {}
  redundant_columns: ["education"]


preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      # compact (1 column per feature) and informative; sklearn's version cross-fits, so no leak
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"       # median/IQR: the few extreme counts (e.g. priors_count) don't set the scale for everyone
  preprocessing:
  numeric_features:
    - age
    - education_num
    - capital_gain
    - capital_loss
    - hours_per_week
    - v01
    - v02
    - v03
    - v04
    - v05
    - v06
    - v07
    - v08
    - v09
    - v10
    - v11
    - v12
    - v13
    - v14
    - v15
    - v16
    - v17
    - v18
  categorical_features:
    - workclass
    - marital_status
    - occupation
    - relationship
    - race
    - v19
    - v20
    - v21
    - v22
    - v23
    - v24
    - v25
  # MNAR-diagnosed columns (see diagnostics above / the EDA notebook's mechanism test) get an
  # extra "_was_missing" flag alongside their imputed value, so the model can still see the
  # pattern even though the fill itself is just a median/mode
  mnar_indicator_sources:
    - workclass
    - occupation
  # seed for the target encoder's internal cross-fitting (week 4: sklearn's TargetEncoder)
  random_state: 42
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"   # applies to sex, age_cat, c_charge_degree





model:
  type: "xgboost"   # one of: decision_tree, random_forest, logistic_regression, oblique_random_forest, adaboost, gradient_boosting, hist_gradient_boosting, naive_bayes
  params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}
  
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight).
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}
  # gradient_boosting:      {random_state: 42}
  # xgboost:                {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}

tuning:
  enabled: False
  n_trials: 5
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 3, high: 15}
      model__min_samples_leaf: {type: int, low: 10, high: 100}
      model__n_estimators: {type: int, low: 50, high: 200}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C:
        type: float
        low: 0.001
        high: 100.0
        log: true
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}



feature_selection:
  enabled: true
  min_votes: 2                                      # 1 (keep almost all) .. 3 (keep only unanimous)
  random_state: 42
  search_space:                                     # tuned together with the model when tuning is on
    select__min_votes: {type: int, low: 1, high: 3}